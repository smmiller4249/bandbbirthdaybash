<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited! Beau & Baylor's Birthday Bash</title>
  
  <!-- Open Graph for Rich Link Previews in Text Messages -->
  <meta property="og:title" content="Beau & Baylor's Birthday Bash Invitation!">
  <meta property="og:description" content="Baylor is turning 8 & Beau is turning 5! Tap to view details and RSVP.">
  <meta property="og:image" content="https://smmiller4249.github.io/bandbbirthdaybash/invite.png">
  <meta property="og:url" content="https://smmiller4249.github.io/bandbbirthdaybash/invite.html">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Outfit', sans-serif; }
    .font-display { font-family: 'Fredoka', cursive, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
    
    <!-- Invitation Image -->
    <div class="relative bg-slate-100">
      <img src="invite.png" alt="Beau and Baylor Birthday Invitation" class="w-full h-auto block select-none">
    </div>

    <!-- Interactive RSVP Call-to-Action -->
    <div class="p-6 text-center space-y-4 bg-white">
      <a href="https://smmiller4249.github.io/bandbbirthdaybash/#rsvp" 
         class="block w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-sky-500 via-indigo-500 to-pink-500 hover:opacity-95 text-white font-display font-bold text-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 active:translate-y-0 animate-bounce">
        💌 Click Here to RSVP!
      </a>

      <div class="pt-2 border-t border-slate-100 flex items-center justify-center gap-4 text-xs font-semibold text-slate-500">
        <span><i class="fa-solid fa-calendar-day text-amber-500 mr-1"></i> Dec 13, 2026</span>
        <span>•</span>
        <a href="https://www.google.com/maps/search/?api=1&query=11510+Woodstock+Rd,+Roswell,+GA+30075" target="_blank" class="hover:text-sky-600 underline">
          <i class="fa-solid fa-location-dot text-rose-500 mr-1"></i> Recess in Roswell
        </a>
      </div>
    </div>

  </div>

</body>
</html>
